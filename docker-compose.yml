networks:
  matp_net:

volumes:
  postgres_data:
  logs:
  strategy_configs:

services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      order-listener:
        condition: service_healthy
      order-generator:
        condition: service_started
      dashboard-api:
        condition: service_healthy
      dashboard-ui:
        condition: service_started
      strategy-tester:
        condition: service_healthy
      tester-ui:
        condition: service_started
    networks: [matp_net]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: matp
      POSTGRES_USER: matp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [matp_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks: [matp_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-listener:
    build: ./order-listener
    environment:
      DATABASE_URL: postgresql://matp:matp@postgres:5432/matp
      REDIS_URL: redis://redis:6379
      EXECUTOR_URL: http://order-executor:8004
      MASTER_KEY: ${MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      order-executor:
        condition: service_healthy
    networks: [matp_net]
    restart: unless-stopped
    volumes:
      - logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-generator:
    build: ./order-generator
    environment:
      DATABASE_URL: postgresql://matp:matp@postgres:5432/matp
      LISTENER_WEBHOOK_URL: http://order-listener:8001/webhook
      DATA_FEED_EXCHANGE: ${DATA_FEED_EXCHANGE:-binance}
    volumes:
      - strategy_configs:/app/strategies_config
    depends_on:
      order-listener:
        condition: service_started
      postgres:
        condition: service_healthy
    networks: [matp_net]
    restart: unless-stopped

  order-executor:
    build: ./order-executor
    environment:
      DATABASE_URL: postgresql://matp:matp@postgres:5432/matp
      REDIS_URL: redis://redis:6379
      MASTER_KEY: ${MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [matp_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard-api:
    build: ./dashboard-api
    environment:
      DATABASE_URL: postgresql://matp:matp@postgres:5432/matp
      REDIS_URL: redis://redis:6379
      GENERATOR_URL: http://order-generator:8002
      LISTENER_URL: http://order-listener:8001
      EXECUTOR_URL: http://order-executor:8004
      AI_SIGNAL_GENERATOR_URL: http://ai-signal-generator:8005
      # Namespace of the Redis candle streams the chart endpoints read.
      INGESTION_EXCHANGE: blofin
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      CONFIG_SECRET_KEY: ${CONFIG_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [matp_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard-ui:
    build: ./dashboard-ui
    environment:
      VITE_API_BASE: /api/dashboard
      VITE_WS_URL: /ws/orders
    depends_on:
      dashboard-api:
        condition: service_healthy
    networks: [matp_net]
    restart: unless-stopped

  ai-signal-generator:
    build: ./ai-signal-generator
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://matp:matp@postgres:5432/matp}
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CONFIG_SECRET_KEY: ${CONFIG_SECRET_KEY}
      CRYPTOPANIC_API_KEY: ${CRYPTOPANIC_API_KEY}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      SIGNAL_VENUES: ${SIGNAL_VENUES:-binance,bybit,okx}
      MATP_LISTENER_URL: http://order-listener:8001
      MATP_EXECUTOR_URL: http://order-executor:8004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      order-listener:
        condition: service_healthy
      order-executor:
        condition: service_healthy
    networks: [matp_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  strategy-tester:
    build:
      context: .
      dockerfile: strategy-tester/Dockerfile
    environment:
      DATABASE_URL: postgresql://matp:matp@postgres:5432/matp
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CONFIG_SECRET_KEY: ${CONFIG_SECRET_KEY}
      TESTER_DEFAULT_BALANCE: ${TESTER_DEFAULT_BALANCE:-1000.0}
      TESTER_DEFAULT_SLIPPAGE_PCT: ${TESTER_DEFAULT_SLIPPAGE_PCT:-0.05}
      TESTER_DEFAULT_FEE_PCT: ${TESTER_DEFAULT_FEE_PCT:-0.02}
      TESTER_MAX_CONCURRENT_RUNS: ${TESTER_MAX_CONCURRENT_RUNS:-1}
      TESTER_LLM_FAILURE_THRESHOLD: ${TESTER_LLM_FAILURE_THRESHOLD:-0.05}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [matp_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  tester-ui:
    build: ./tester-ui
    depends_on:
      strategy-tester:
        condition: service_healthy
    networks: [matp_net]
    restart: unless-stopped

  market-ingestion:
    build: ./market-ingestion
    environment:
      REDIS_URL: redis://redis:6379
      INGESTION_EXCHANGE: blofin
      INGESTION_MODE: live
      # These streams feed signal-engine, and are the chart's FALLBACK candle
      # source only. A chart of a trade asks order-executor for the bars of the
      # account's own venue and mode first, always — a demo account fills in a
      # simulated market whose prices drift from these live ones, and drawing its
      # entry/stop/target over live bars puts the lines where the trade never was
      # (docs/process/reports/btc-ai-position-chart-investigation.md). The stream
      # is used only when that venue cannot be reached, and the chart says so.
      # Every symbol with an enabled strategy still gets the full ladder
      # (1m 5m 15m 30m 1h 4h 1d) so the fallback can serve any rung the picker
      # offers. One ccxt.pro instance multiplexes all of these over a single WS
      # connection. HYPE-USDT and SUI-USDT are absent: both strategies are
      # disabled, and their charts now come from the exchange anyway.
      INGESTION_SUBSCRIPTIONS: >-
        BTC-USDT:1m,BTC-USDT:5m,BTC-USDT:15m,BTC-USDT:30m,BTC-USDT:1h,BTC-USDT:4h,BTC-USDT:1d,
        ETH-USDT:1m,ETH-USDT:5m,ETH-USDT:15m,ETH-USDT:30m,ETH-USDT:1h,ETH-USDT:4h,ETH-USDT:1d,
        SOL-USDT:1m,SOL-USDT:5m,SOL-USDT:15m,SOL-USDT:30m,SOL-USDT:1h,SOL-USDT:4h,SOL-USDT:1d,
        BNB-USDT:1m,BNB-USDT:5m,BNB-USDT:15m,BNB-USDT:30m,BNB-USDT:1h,BNB-USDT:4h,BNB-USDT:1d,
        TAO-USDT:1m,TAO-USDT:5m,TAO-USDT:15m,TAO-USDT:30m,TAO-USDT:1h,TAO-USDT:4h,TAO-USDT:1d,
        XRP-USDT:1m,XRP-USDT:5m,XRP-USDT:15m,XRP-USDT:30m,XRP-USDT:1h,XRP-USDT:4h,XRP-USDT:1d
      INGESTION_WARMUP_CANDLES: "500"
    depends_on:
      redis:
        condition: service_healthy
    networks: [matp_net]
    restart: unless-stopped

  signal-engine:
    build: ./signal-engine
    environment:
      DATABASE_URL: postgresql://matp:matp@postgres:5432/matp
      REDIS_URL: redis://redis:6379
      INGESTION_EXCHANGE: blofin
      WARMUP_CANDLES: "500"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [matp_net]
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    environment:
      DATABASE_URL: postgresql://matp:matp@postgres:5432/matp
      REDIS_URL: redis://redis:6379
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      EXCHANGES: ${NOTIFICATION_EXCHANGES:-blofin}
      LISTENER_URL: http://order-listener:8001
      EXECUTOR_URL: http://order-executor:8004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [matp_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  social-listener:
    build: ./social-listener
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://matp:matp@postgres:5432/matp}
      REDIS_URL: redis://redis:6379
      TG_API_ID: ${TG_API_ID:-0}
      TG_API_HASH: ${TG_API_HASH:-}
      TG_SESSION: ${TG_SESSION:-}
      TG_CHANNEL: ${TG_CHANNEL:-AstronomerZero}
      BACKFILL_LIMIT: ${BACKFILL_LIMIT:-50}
      EXTRACTOR_PROVIDER: ${EXTRACTOR_PROVIDER:-anthropic}
      EXTRACTOR_MODEL: ${EXTRACTOR_MODEL:-claude-sonnet-4-6}
      EXTRACTOR_TEMPERATURE: ${EXTRACTOR_TEMPERATURE:-0.0}
      EXTRACTOR_FALLBACKS: ${EXTRACTOR_FALLBACKS:-google:gemini-3.6-flash}
      EXECUTION_MODE: ${SOCIAL_EXECUTION_MODE:-shadow}
      EXECUTION_STRATEGY_ID: ${SOCIAL_EXECUTION_STRATEGY_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CONFIG_SECRET_KEY: ${CONFIG_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [matp_net]
    restart: unless-stopped
